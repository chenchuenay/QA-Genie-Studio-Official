name: release

on:
  push:
    tags: ["v*"]

jobs:
  deploy_cf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install firebase-tools
        run: npm install -g firebase-tools

      - name: deploy Cloud Functions
        run: firebase deploy --only functions --project qa-genie-ai --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: functions

  build_aab:
    needs: deploy_cf
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: "stable"

      - name: decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE_B64 }}" | base64 -d > /tmp/qa-genie-release.jks
          echo "storeFile=/tmp/qa-genie-release.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> android/key.properties

      - name: flutter pub get
        run: flutter pub get

      - name: build prod AAB
        run: flutter build appbundle --flavor prod -t lib/main.dart --dart-define=MODE=prod

      - uses: actions/upload-artifact@v4
        with:
          name: QA_Genie_prod.aab
          path: build/app/outputs/bundle/prodRelease/*.aab
          retention-days: 90
