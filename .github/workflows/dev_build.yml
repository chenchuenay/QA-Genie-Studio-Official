name: dev_build

on:
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_dev_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: "stable"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: build dev APK
        run: flutter build apk --flavor dev -t lib/dev_main.dart --dart-define=MODE=dev

      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
