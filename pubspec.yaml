name: qa_genie
description: "QA Genie – AI-Powered Test Flow Engine"
publish_to: "none"
version: 1.2.41

environment:
  sdk: ^3.11.0

dependencies:
  file_picker: ^8.3.7
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  sqflite: ^2.3.0
  path: ^1.8.3
  http: ^0.13.6
  excel: ^4.0.6
  path_provider: ^2.1.2
  share_plus: ^10.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.2
  device_info_plus: ^9.1.2
  package_info_plus: ^8.1.0
  pdf: ^3.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  google_mobile_ads: ^9.0.0

  connectivity_plus: any
  firebase_app_check: any
  firebase_analytics: any
  cloud_functions: ^5.6.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.1
  firebase_installations: ^16.3.6

  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  mockito: ^5.4.4
  build_runner: ^2.4.11
  sqflite_common_ffi: ^2.3.3
  fake_cloud_firestore: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  color: "#020409"
  image: assets/logo.png
  android_12:
    color: "#020409"
    image: assets/logo.png
